<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>بوصلة المتدرب التقني - م/ عادل الشمري</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* ===== المتغيرات الأساسية ===== */
        :root {
            --gold-light: #f1d279;
            --gold-main:  #d4af37;
            --gold-dark:  #aa8c2c;
            --bg-dark:    #0b0b0b;
            --text-light: #ffffff;
            --blue-gps:   #2196F3;
            --success:    #27ae60;
            --font:       'Tajawal', 'Segoe UI', Tahoma, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%; width: 100%;
            font-family: var(--font);
            background: var(--bg-dark);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== شاشة الترحيب ===== */
        #welcome-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(ellipse at 50% 20%, #1c1600 0%, #000 65%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 30px;
            transition: opacity 0.8s ease;
            overflow: hidden;
        }

        /* فقاعات الخلفية */
        .orb {
            position: absolute; border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(212,175,55,0.18) 0%, transparent 70%);
            animation: orb-pulse 5s ease-in-out infinite;
        }
        .orb-1 { width: 320px; height: 320px; top: -100px; right: -80px; animation-delay: 0s; }
        .orb-2 { width: 220px; height: 220px; bottom: 60px;  left:  -60px; animation-delay: 2s; }
        .orb-3 { width: 160px; height: 160px; bottom: 200px; right:  10px; animation-delay: 4s; }
        @keyframes orb-pulse {
            0%,100% { transform: scale(1);   opacity: .35; }
            50%      { transform: scale(1.25); opacity: .75; }
        }

        /* شعار التطبيق */
        .welcome-logo {
            width: 88px; height: 88px;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; margin-bottom: 22px; position: relative; z-index: 1;
            box-shadow: 0 0 50px rgba(212,175,55,.5);
            animation: logo-float 3.5s ease-in-out infinite;
        }
        @keyframes logo-float {
            0%,100% { transform: translateY(0);   }
            50%      { transform: translateY(-10px); }
        }

        .app-title {
            font-size: 2.6rem; font-weight: 900; line-height: 1.25;
            background: linear-gradient(to bottom, #f9e49a 0%, #d4af37 50%, #7a5e10 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; position: relative; z-index: 1; margin-bottom: 10px;
        }

        .app-subtitle {
            color: #777; font-size: 1rem; line-height: 1.7;
            position: relative; z-index: 1; margin-bottom: 38px;
        }
        .app-subtitle span { color: var(--gold-main); font-weight: 700; }

        .start-btn {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-light));
            color: #000; border: none; padding: 16px 64px;
            border-radius: 50px; font-size: 1.2rem; font-weight: 900;
            cursor: pointer; font-family: var(--font); position: relative; z-index: 1;
            box-shadow: 0 6px 28px rgba(212,175,55,.55);
            transition: transform .15s, box-shadow .15s;
        }
        .start-btn:active { transform: scale(.96); box-shadow: 0 2px 10px rgba(212,175,55,.3); }

        .signature {
            position: absolute; bottom: 22px;
            color: #444; font-size: .85rem; z-index: 1;
        }
        .signature span { color: var(--gold-dark); }

        /* ===== الواجهة الرئيسية ===== */
        #main-app { display: none; height: 100%; flex-direction: column; position: relative; }

        /* شريط البحث */
        .search-nav {
            position: absolute; top: 15px; left: 12px; right: 12px; z-index: 1000;
            background: rgba(0,0,0,.92); padding: 4px;
            border-radius: 16px; border: 2px solid var(--gold-main);
            backdrop-filter: blur(10px);
        }
        input {
            width: 100%; padding: 13px; border: none;
            font-size: 1.1rem; text-align: center;
            background: transparent; color: var(--gold-light);
            outline: none; font-weight: 700; font-family: var(--font);
        }
        input::placeholder { color: #444; font-weight: 500; }

        /* شريط الحالة أثناء التنقل */
        #status-bar {
            position: absolute; top: 88px; left: 12px; right: 12px; z-index: 999;
            background: rgba(0,0,0,.9); border: 1px solid var(--gold-main);
            border-radius: 14px; padding: 10px 14px;
            display: none; backdrop-filter: blur(8px);
        }
        .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .status-info { flex: 1; }
        .status-bldg  { color: var(--gold-light); font-weight: 800; font-size: .92rem; }
        .status-dist  { color: var(--success); font-size: .82rem; margin-top: 3px; font-weight: 700; }
        .status-eta   { color: #888; font-size: .75rem; margin-top: 2px; }
        .cancel-btn {
            background: rgba(231,76,60,.15); border: 1px solid rgba(231,76,60,.4);
            color: #e74c3c; width: 36px; height: 36px; border-radius: 8px;
            font-size: 1rem; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }

        /* الخريطة */
        #map { flex: 1; width: 100%; height: 100vh; }

        /* أيقونة المستخدم */
        .user-location-icon {
            position: relative; width: 20px; height: 20px;
            background: var(--blue-gps); border: 3px solid white;
            border-radius: 50%; box-shadow: 0 0 12px rgba(33,150,243,.7);
        }
        .user-heading-beam {
            position: absolute; top: -45px; left: -15px; width: 50px; height: 50px;
            background: radial-gradient(ellipse at bottom, rgba(33,150,243,.6) 0%, rgba(33,150,243,0) 70%);
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            transform-origin: bottom center; pointer-events: none; transition: transform .2s ease;
        }
        @keyframes pulse-ring {
            0%   { transform: scale(1);   opacity: .7; }
            100% { transform: scale(3.5); opacity: 0; }
        }
        .pulse-ring {
            position: absolute; width: 20px; height: 20px; border-radius: 50%;
            background: rgba(33,150,243,.25);
            animation: pulse-ring 2s ease-out infinite;
            top: 0; left: 0; pointer-events: none;
        }

        /* بطاقة المعلومات */
        .info-card {
            position: absolute; bottom: 22px; left: 12px; right: 12px; z-index: 1000;
            background: rgba(14,14,14,.98); border: 1px solid rgba(212,175,55,.3);
            border-radius: 20px; padding: 18px; display: none;
            box-shadow: 0 -5px 30px rgba(0,0,0,.7);
            backdrop-filter: blur(10px);
        }
        .info-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .info-bldg-icon {
            width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 1.6rem;
        }
        .info-bldg-name { color: var(--gold-light); font-size: 1.1rem; font-weight: 900; }
        .info-bldg-cat  { color: #555; font-size: .8rem; margin-top: 3px; }

        .info-detail {
            background: rgba(255,255,255,.04); border: 1px solid rgba(212,175,55,.15);
            border-radius: 12px; padding: 12px 14px;
            color: #ccc; font-size: .92rem; line-height: 1.7;
        }

        /* شارات المسافة والوقت */
        .info-meta { display: flex; gap: 10px; margin-top: 12px; }
        .info-badge {
            flex: 1; background: rgba(255,255,255,.04); border: 1px solid #222;
            border-radius: 10px; padding: 9px; text-align: center;
        }
        .badge-val { color: var(--gold-main); font-size: 1.1rem; font-weight: 900; }
        .badge-lbl { color: #555; font-size: .72rem; margin-top: 2px; }

        .go-btn {
            background: linear-gradient(135deg, #1a6e2e, var(--success));
            color: white; border: none; padding: 15px; border-radius: 14px;
            font-weight: 900; width: 100%; margin-top: 14px; font-size: 1.1rem;
            cursor: pointer; font-family: var(--font);
            box-shadow: 0 4px 18px rgba(39,174,96,.35);
        }

        /* أزرار الجانب */
        .side-controls {
            position: absolute; top: 50%; right: 15px; transform: translateY(-50%);
            z-index: 1000; display: flex; flex-direction: column; gap: 10px;
        }
        .btn-side {
            background: rgba(0,0,0,.88); color: var(--gold-main);
            border: 1.5px solid rgba(212,175,55,.5);
            width: 46px; height: 46px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer; font-family: var(--font);
            backdrop-filter: blur(6px); transition: all .15s;
        }
        .btn-side:active { background: rgba(212,175,55,.15); transform: scale(.93); }

        /* ===== إشعار الوصول ===== */
        #arrival-notif {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 9500;
            background: linear-gradient(135deg, #155724, var(--success));
            border-radius: 24px; padding: 34px 44px; text-align: center;
            box-shadow: 0 0 70px rgba(39,174,96,.7);
            transition: transform .45s cubic-bezier(.175,.885,.32,1.275);
            min-width: 260px;
        }
        #arrival-notif.show { transform: translate(-50%, -50%) scale(1); }
        .arrival-icon  { font-size: 3.8rem; display: block; margin-bottom: 12px; }
        .arrival-title { color: #fff; font-size: 1.5rem; font-weight: 900; }
        .arrival-sub   { color: rgba(255,255,255,.8); font-size: .92rem; margin-top: 6px; }
        .arrival-close {
            margin-top: 22px; background: rgba(255,255,255,.18);
            border: none; color: #fff; padding: 11px 34px;
            border-radius: 30px; font-family: var(--font);
            font-size: 1rem; cursor: pointer; font-weight: 700;
        }

        /* ===== toast ===== */
        #toast {
            position: fixed; bottom: 110px; left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: rgba(0,0,0,.92); color: #fff;
            padding: 11px 24px; border-radius: 30px; font-size: .9rem;
            z-index: 8000; opacity: 0; transition: all .3s; pointer-events: none;
            border: 1px solid rgba(212,175,55,.3); white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== توقيع ===== */
        .app-sig {
            position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
            color: var(--gold-main); font-weight: 700; font-size: 1rem; z-index: 1000;
            pointer-events: none; white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0,0,0,.8);
        }
    </style>
</head>
<body>

<!-- ===== شاشة الترحيب ===== -->
<div id="welcome-screen">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="welcome-logo">🧭</div>
    <h1 class="app-title">بوصلة المتدرب التقني</h1>
    <p class="app-subtitle">
        مرحباً بك في<br>
        <span>الكلية التقنية بالقريات</span><br>
        دليلك الذكي للوصول بدقة واحترافية
    </p>
    <button class="start-btn" onclick="requestPermissions()">ابدأ الآن ←</button>
    <div class="signature">من إعداد: <span>م/ عادل الشمري</span></div>
</div>

<!-- ===== الواجهة الرئيسية ===== -->
<div id="main-app">

    <div class="search-nav">
        <input type="text" id="roomInput"
               placeholder="🔍  بحث (مصلى، مسرح، أو رقم القاعة...)"
               maxlength="20" autocomplete="off">
    </div>

    <!-- شريط الحالة أثناء التنقل -->
    <div id="status-bar">
        <div class="status-row">
            <div class="status-info">
                <div class="status-bldg">📍 <span id="statusBldg"></span></div>
                <div class="status-dist" id="statusDist">جاري التحديد...</div>
                <div class="status-eta"  id="statusEta"></div>
            </div>
            <button class="cancel-btn" onclick="cancelJourney()" title="إلغاء الرحلة">✕</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- بطاقة المعلومات -->
    <div class="info-card" id="infoCard">
        <div class="info-header">
            <div class="info-bldg-icon" id="infoBldgIcon"></div>
            <div>
                <div class="info-bldg-name" id="bldgName"></div>
                <div class="info-bldg-cat"  id="bldgCat"></div>
            </div>
        </div>
        <div class="info-detail" id="targetDetail"></div>
        <div class="info-meta">
            <div class="info-badge">
                <div class="badge-val" id="metaDist">—</div>
                <div class="badge-lbl">المسافة (م)</div>
            </div>
            <div class="info-badge">
                <div class="badge-val" id="metaEta">—</div>
                <div class="badge-lbl">وقت الوصول</div>
            </div>
        </div>
        <button id="goBtn" class="go-btn" onclick="startJourney()">انطلاق 🚀</button>
    </div>

    <!-- أزرار الجانب -->
    <div class="side-controls">
        <button class="btn-side" onclick="centerOnUser()" title="موقعي">🎯</button>
        <button class="btn-side" onclick="map.zoomIn()">+</button>
        <button class="btn-side" onclick="map.zoomOut()">−</button>
        <button class="btn-side" onclick="location.reload()">🔄</button>
    </div>

    <div class="app-sig">م/ عادل الشمري</div>
</div>

<!-- ===== إشعار الوصول ===== -->
<div id="arrival-notif">
    <span class="arrival-icon">🏁</span>
    <div class="arrival-title">وصلت!</div>
    <div class="arrival-sub" id="arrivalBldg"></div>
    <button class="arrival-close" onclick="dismissArrival()">حسناً ✓</button>
</div>

<!-- toast -->
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ========================================================
   البيانات
======================================================== */
const collegeCenter = [31.3893496, 37.3102727];
const WALK_SPEED    = 80; // متر / دقيقة

const buildings = {
    "1": { name: "مبنى 1 - الأنشطة والمسرح",        short: "الأنشطة والمسرح",     coords: [31.3885802, 37.3098097], color: "#e74c3c", icon: "🎭", cat: "نشاط"   },
    "2": { name: "مبنى 2 - الدعم الفني والشبكات",   short: "الدعم الفني",          coords: [31.3884981, 37.3106472], color: "#3498db", icon: "💻", cat: "تقنية"  },
    "3": { name: "مبنى 3 - الدراسات العامة والمحاسبة", short: "الدراسات العامة",   coords: [31.3888144, 37.3111052], color: "#9b59b6", icon: "📚", cat: "دراسة"  },
    "4": { name: "مبنى 4 - الكافتيريا والبوفيه",    short: "الكافتيريا",           coords: [31.3892940, 37.3111964], color: "#f39c12", icon: "☕", cat: "طعام"   },
    "5": { name: "مبنى 5 - المصلى والجامع",         short: "المصلى",               coords: [31.3896953, 37.3114700], color: "#1abc9c", icon: "🕌", cat: "ديني"   },
    "6": { name: "مبنى 6 - ورش الميكانيكا",         short: "ورش الميكانيكا",       coords: [31.3903633, 37.3105369], color: "#e67e22", icon: "🔧", cat: "ورشة"   },
    "7": { name: "مبنى 7 - قسم التقنية الميكانيكية", short: "التقنية الميكانيكية", coords: [31.3904349, 37.3098989], color: "#2ecc71", icon: "⚙️", cat: "تقنية"  },
    "8": { name: "مبنى 8 - العمادة وشؤون المتدربين", short: "العمادة",             coords: [31.3898115, 37.3093759], color: "#d4af37", icon: "🏛️", cat: "إدارة"  }
};

const keywordMap = {
    "بوفيه":"4","كافتيريا":"4","مصلى":"5","جامع":"5",
    "عمادة":"8","شؤون":"8","مسرح":"1","أنشطة":"1",
    "شبكات":"2","دعم":"2","محاسبة":"3","دراسات":"3",
    "ميكانيكا":"6","ورش":"6","ورشة":"6","تقنية":"7"
};

/* ========================================================
   الحالة
======================================================== */
let map, userMarker, destMarker, routeLine;
let isNavigating       = false;
let arrivedNotified    = false;
let lastUserCoords     = null;
let userHeading        = 0;
let currentDest        = null;   // { bId, b }

/* ========================================================
   تهيئة الخريطة
======================================================== */
function initMap() {
    map = L.map('map', { zoomControl: false, maxZoom: 20 }).setView(collegeCenter, 18);
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);
    addBuildingMarkers();
}

/* ===== أيقونة مبنى ملوّنة ===== */
function makeBldgIcon(b) {
    return L.divIcon({
        className: '',
        html: `
          <div style="
            width:38px;height:38px;border-radius:50% 50% 50% 0;
            background:${b.color};transform:rotate(-45deg);
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 4px 14px rgba(0,0,0,.55);
            border:2px solid rgba(255,255,255,.3);">
              <span style="transform:rotate(45deg);font-size:1rem;line-height:1">${b.icon}</span>
          </div>`,
        iconSize:   [38, 38],
        iconAnchor: [19, 38]
    });
}

function addBuildingMarkers() {
    Object.entries(buildings).forEach(([id, b]) => {
        L.marker(b.coords, { icon: makeBldgIcon(b) })
            .addTo(map)
            .bindPopup(`<b style="font-family:'Tajawal',sans-serif;font-size:.95rem">${b.name}</b>`)
            .on('click', () => executeSearch(id, "key", b.short));
    });
}

/* ========================================================
   الصلاحيات والبداية
======================================================== */
async function requestPermissions() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const p = await DeviceOrientationEvent.requestPermission();
            if (p === 'granted') window.addEventListener('deviceorientation', handleOrientation);
        } catch(e) { /* تجاهل */ }
    } else {
        window.addEventListener('deviceorientation', handleOrientation);
    }
    startApp();
}

function startApp() {
    const ws = document.getElementById('welcome-screen');
    ws.style.opacity = '0';
    setTimeout(() => {
        ws.style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        initMap();
        map.invalidateSize();
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(updatePos, null,
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }
    }, 800);
}

/* ========================================================
   البوصلة
======================================================== */
function handleOrientation(e) {
    userHeading = e.webkitCompassHeading || (360 - e.alpha);
    const beam = document.querySelector('.user-heading-beam');
    if (beam) beam.style.transform = `rotate(${userHeading}deg)`;
}

/* ========================================================
   تحديث الموقع
======================================================== */
function updatePos(pos) {
    lastUserCoords = [pos.coords.latitude, pos.coords.longitude];

    const icon = L.divIcon({
        className: 'custom-user-icon',
        html: `<div style="position:relative">
                 <div class="pulse-ring"></div>
                 <div class="user-location-icon">
                   <div class="user-heading-beam" style="transform:rotate(${userHeading}deg)"></div>
                 </div>
               </div>`,
        iconSize: [20, 20], iconAnchor: [10, 10]
    });

    if (!userMarker) {
        userMarker = L.marker(lastUserCoords, { icon, zIndexOffset: 1000 }).addTo(map);
    } else {
        userMarker.setLatLng(lastUserCoords);
        userMarker.setIcon(icon);
    }

    if (destMarker && currentDest) {
        const dist = map.distance(lastUserCoords, destMarker.getLatLng());
        drawRoute(lastUserCoords, destMarker.getLatLng(), dist);

        if (isNavigating) {
            map.setView(lastUserCoords, map.getZoom());
            if (dist < 10 && !arrivedNotified) {
                arrivedNotified = true;
                showArrival();
            }
        }
    }
}

/* ========================================================
   رسم المسار + المسافة + ETA
======================================================== */
function drawRoute(start, end, dist) {
    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.polyline([start, end], {
        color: '#d4af37', weight: 7, opacity: .85, dashArray: '1, 15'
    }).addTo(map);

    if (isNavigating && dist !== undefined) {
        const arrived = dist < 6;
        const distTxt = arrived ? "وصلت! 🏁" : `${Math.round(dist)} متر`;
        const eta     = arrived ? "أنت هنا" : `~${Math.max(1, Math.round(dist / WALK_SPEED))} دقيقة`;
        document.getElementById('statusDist').textContent = distTxt;
        document.getElementById('statusEta').textContent  = `⏱ الوقت المتوقع: ${eta}`;
    }
}

/* ========================================================
   البحث
======================================================== */
document.getElementById('roomInput').addEventListener('input', function(e) {
    const val   = e.target.value.trim();
    const valUp = val.toUpperCase();

    // بحث بالكلمة المفتاحية
    for (const k in keywordMap) {
        if (val.includes(k)) {
            executeSearch(keywordMap[k], "key", k);
            return;
        }
    }

    // رمز القاعة (10 أحرف)
    if (valUp.length === 10) {
        const bId      = valUp[4];
        const floor    = valUp[5];
        const char7    = valUp[6];
        const char8    = valUp[7];
        const isWS     = isNaN(valUp.charAt(9));

        if (isWS) {
            if (floor !== char7) { showToast("تنبيه: رقم الدور غير متطابق"); return; }
        } else {
            if (floor !== char8) { showToast("تنبيه: رقم الدور غير متطابق"); return; }
        }
        executeSearch(bId, isWS ? "workshop" : "code",
            { f: floor, r: valUp.substring(isWS ? 6 : 7) });
    }
});

/* ========================================================
   تنفيذ البحث وعرض البطاقة
======================================================== */
function executeSearch(bId, type, data) {
    const b = buildings[bId];
    if (!b) return;

    isNavigating    = false;
    arrivedNotified = false;
    currentDest     = { bId, b };

    document.getElementById('status-bar').style.display = 'none';

    // أيقونة + اسم المبنى
    const iconEl = document.getElementById('infoBldgIcon');
    iconEl.textContent  = b.icon;
    iconEl.style.background = b.color + '28';
    iconEl.style.border     = `1px solid ${b.color}55`;

    document.getElementById('bldgName').textContent = b.name;
    document.getElementById('bldgCat').textContent  = `${b.cat} • مبنى ${bId}`;

    // علامة الوجهة على الخريطة
    if (destMarker) map.removeLayer(destMarker);
    destMarker = L.marker(b.coords, {
        icon: L.divIcon({
            className: '',
            html: `<div style="
                     width:18px;height:18px;border-radius:50%;background:#fff;
                     border:3px solid ${b.color};
                     box-shadow:0 0 16px ${b.color}cc"></div>`,
            iconSize: [18,18], iconAnchor: [9,9]
        })
    }).addTo(map).bindPopup(b.name).openPopup();

    map.flyTo(b.coords, 19);

    // تفاصيل الوجهة
    const fNames = { "0":"الأرضي","1":"الأول","2":"الثاني","3":"الثالث" };
    let detail = "";
    if (type === "key") {
        detail = `🏢 وجهتك: <b>${b.name}</b>`;
    } else {
        let desc = (bId === "7" && data.f === "3") ? "مكاتب إدارية" : "قاعات / معامل";
        if (bId === "6" || type === "workshop") desc = "ورش الميكانيكا";
        detail = `الدور <b>${fNames[data.f] || data.f}</b> — ${desc}<br>📌 رقم: <b>${data.r}</b>`;
    }
    document.getElementById('targetDetail').innerHTML = detail;

    // مسافة + ETA
    if (lastUserCoords) {
        const dist = map.distance(lastUserCoords, b.coords);
        const eta  = Math.max(1, Math.round(dist / WALK_SPEED));
        document.getElementById('metaDist').textContent = Math.round(dist);
        document.getElementById('metaEta').textContent  = `${eta} د`;
        drawRoute(lastUserCoords, b.coords, dist);
    } else {
        document.getElementById('metaDist').textContent = '—';
        document.getElementById('metaEta').textContent  = '—';
    }

    document.getElementById('infoCard').style.display = 'block';
}

/* ========================================================
   بدء الرحلة / إلغاؤها
======================================================== */
function startJourney() {
    if (!currentDest) return;
    isNavigating    = true;
    arrivedNotified = false;
    document.getElementById('infoCard').style.display  = 'none';
    document.getElementById('status-bar').style.display = 'block';
    document.getElementById('statusBldg').textContent   = currentDest.b.name;
    centerOnUser();
}

function cancelJourney() {
    isNavigating = false;
    document.getElementById('status-bar').style.display = 'none';
    if (routeLine)  { map.removeLayer(routeLine);  routeLine  = null; }
    if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
    currentDest     = null;
    arrivedNotified = false;
    document.getElementById('roomInput').value = '';
    showToast("تم إلغاء الرحلة");
}

function centerOnUser() {
    if (lastUserCoords) map.setView(lastUserCoords, 19);
}

/* ========================================================
   إشعار الوصول
======================================================== */
function showArrival() {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
    document.getElementById('arrivalBldg').textContent = currentDest?.b.short || '';
    document.getElementById('arrival-notif').classList.add('show');
    document.getElementById('statusDist').textContent = "وصلت! 🏁";
    document.getElementById('statusEta').textContent  = "";
}

function dismissArrival() {
    document.getElementById('arrival-notif').classList.remove('show');
}

/* ========================================================
   Toast
======================================================== */
let _toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
