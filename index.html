<!DOCTYPE html>

<head>

<style>
:root{--gold:#d4af37;--gold-l:#f1d279;--gold-d:#aa8c2c;--bg:#0b0b0b;--green:#27ae60;--font:'Tajawal',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;font-family:var(--font);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
#welcome{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 20%,#1c1600,#000 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity .8s;overflow:hidden}
.orb{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(212,175,55,.18),transparent 70%);animation:orbp 5s ease-in-out infinite}
.orb1{width:320px;height:320px;top:-100px;right:-80px}.orb2{width:220px;height:220px;bottom:60px;left:-60px;animation-delay:2s}.orb3{width:160px;height:160px;bottom:200px;right:10px;animation-delay:4s}
@keyframes orbp{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.25);opacity:.75}}
.wlogo{width:88px;height:88px;background:linear-gradient(135deg,var(--gold-d),var(--gold-l));border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:22px;z-index:1;box-shadow:0 0 50px rgba(212,175,55,.5);animation:flt 3.5s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wtitle{font-size:2.6rem;font-weight:900;background:linear-gradient(to bottom,#f9e49a,#d4af37 50%,#7a5e10);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;z-index:1;margin-bottom:10px;line-height:1.25}
.wsub{color:#777;font-size:1rem;line-height:1.7;z-index:1;margin-bottom:38px}.wsub span{color:var(--gold);font-weight:700}
.wbtn{background:linear-gradient(135deg,var(--gold-d),var(--gold-l));color:#000;border:none;padding:16px 64px;border-radius:50px;font-size:1.2rem;font-weight:900;cursor:pointer;font-family:var(--font);z-index:1;box-shadow:0 6px 28px rgba(212,175,55,.55);transition:transform .15s}
.wbtn:active{transform:scale(.96)}
.wsig{position:absolute;bottom:22px;color:#444;font-size:.85rem;z-index:1}.wsig span{color:var(--gold-d)}
#app{display:none;height:100%;flex-direction:column;position:relative}
.snav{position:absolute;top:15px;left:12px;right:12px;z-index:2000;background:rgba(0,0,0,.92);padding:4px;border-radius:16px;border:2px solid var(--gold);backdrop-filter:blur(10px)}
#roomInput{width:100%;padding:13px;border:none;font-size:1.1rem;text-align:center;background:transparent;color:var(--gold-l);outline:none;font-weight:700;font-family:var(--font)}
#roomInput::placeholder{color:#444;font-weight:500}
#statusBar{position:absolute;top:88px;left:12px;right:12px;z-index:1999;background:rgba(0,0,0,.9);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;display:none;backdrop-filter:blur(8px)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px}.sinfo{flex:1}
.sbldg{color:var(--gold-l);font-weight:800;font-size:.92rem}.sdist{color:var(--green);font-size:.82rem;margin-top:3px;font-weight:700}.seta{color:#888;font-size:.75rem;margin-top:2px}
.srtags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.srtag{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.28);color:var(--gold-l);font-size:.72rem;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.xcl{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.4);color:#e74c3c;width:36px;height:36px;border-radius:8px;font-size:1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#satView{position:absolute;inset:0;z-index:1}#map{width:100%;height:100%}
#view3d{position:absolute;inset:0;z-index:2;display:none}
#c3d{width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none;user-select:none}
#loading3d{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.ldspin{width:44px;height:44px;border:4px solid rgba(212,175,55,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.ldtxt{color:var(--gold);font-size:.95rem;font-weight:700}.ldsub{color:#555;font-size:.78rem;margin-top:5px}
.hint3d{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.65);color:#777;font-size:.75rem;padding:6px 16px;border-radius:20px;border:1px solid #333;text-align:center;pointer-events:none;white-space:nowrap}
.icard{position:absolute;bottom:22px;left:12px;right:12px;z-index:3000;background:rgba(14,14,14,.98);border:1px solid rgba(212,175,55,.22);border-radius:20px;padding:20px;display:none;box-shadow:0 -5px 30px rgba(0,0,0,.7);backdrop-filter:blur(10px)}
.ichdr{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.icnum{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900}
.icname{color:var(--gold-l);font-size:1.05rem;font-weight:900;line-height:1.35}.iccat{color:#555;font-size:.8rem;margin-top:4px;font-weight:500}
.icdet{color:#aaa;font-size:.9rem;line-height:1.85;background:rgba(255,255,255,.03);border-radius:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.06)}
.icdet b{color:#ccc;font-weight:700}
.icmeta{display:flex;gap:10px;margin-top:12px}
.ibadge{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;text-align:center}
.bv{color:var(--gold);font-size:1.15rem;font-weight:900}.bl{color:#444;font-size:.72rem;margin-top:3px}
.gobtn{background:linear-gradient(135deg,#1a6e2e,var(--green));color:#fff;border:none;padding:15px;border-radius:12px;font-weight:900;width:100%;margin-top:14px;font-size:1.05rem;cursor:pointer;font-family:var(--font);letter-spacing:.3px}
#parkChoices{margin-top:14px;gap:10px;flex-direction:column}
.pchoice{background:rgba(41,128,185,.10);border:1.5px solid rgba(41,128,185,.45);color:#fff;padding:14px 16px;border-radius:12px;width:100%;cursor:pointer;font-family:var(--font);text-align:right;transition:background .15s,transform .1s}
.pchoice:active{background:rgba(41,128,185,.28);transform:scale(.98)}
.pclabel{color:#7fc8e8;font-weight:900;font-size:.95rem}
.pcdist{color:#666;font-size:.8rem;margin-top:5px}
.sctrl{position:absolute;top:50%;right:15px;transform:translateY(-50%);z-index:2000;display:flex;flex-direction:column;gap:10px}
.bs{background:rgba(0,0,0,.88);color:var(--gold);border:1.5px solid rgba(212,175,55,.45);width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;font-family:var(--font);backdrop-filter:blur(6px);transition:all .15s;font-weight:700}
.bs:active{background:rgba(212,175,55,.12);transform:scale(.93)}.bs.on{background:rgba(212,175,55,.18);border-color:var(--gold)}
.udot{position:relative;width:20px;height:20px;background:#2196F3;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(33,150,243,.7)}
.ubeam{position:absolute;top:-45px;left:-15px;width:50px;height:50px;background:radial-gradient(ellipse at bottom,rgba(33,150,243,.6),transparent 70%);clip-path:polygon(50% 100%,0% 0%,100% 0%);transform-origin:bottom center;pointer-events:none;transition:transform .2s}
@keyframes pr{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.5);opacity:0}}
.pring{position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(33,150,243,.25);animation:pr 2s ease-out infinite;top:0;left:0;pointer-events:none}
#arrival{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:9500;background:linear-gradient(135deg,#155724,var(--green));border-radius:24px;padding:34px 44px;text-align:center;box-shadow:0 0 70px rgba(39,174,96,.7);transition:transform .45s cubic-bezier(.175,.885,.32,1.275);min-width:260px}
#arrival.show{transform:translate(-50%,-50%) scale(1)}
.aricon{font-size:3rem;display:block;margin-bottom:12px;color:#fff}
.artitle{color:#fff;font-size:1.5rem;font-weight:900}.arsub{color:rgba(255,255,255,.8);font-size:.92rem;margin-top:6px}
.arclose{margin-top:22px;background:rgba(255,255,255,.18);border:none;color:#fff;padding:11px 34px;border-radius:30px;font-family:var(--font);font-size:1rem;cursor:pointer;font-weight:700}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(0,0,0,.92);color:#fff;padding:11px 24px;border-radius:30px;font-size:.9rem;z-index:8000;opacity:0;transition:all .3s;pointer-events:none;border:1px solid rgba(212,175,55,.3);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.appsig{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);color:var(--gold);font-weight:700;font-size:.95rem;z-index:2000;pointer-events:none;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="welcome">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
  <div class="wlogo">&#x1F9ED;</div>
  <h1 class="wtitle">بوصلة المتدرب التقني</h1>
  <p class="wsub">مرحباً بك في<br><span>الكلية التقنية بالقريات</span><br>دليلك الذكي للوصول بدقة واحترافية</p>
  <button class="wbtn" onclick="startApp()">ابدأ الآن</button>
  <div class="wsig">من إعداد: <span>م/ عادل الشمري</span></div>
</div>
<div id="app">
  <div class="snav"><input type="text" id="roomInput" placeholder="🔍  بحث (مصلى، مسرح، رقم القاعة...)" maxlength="20" autocomplete="off"></div>
  <div id="statusBar">
    <div class="srow">
      <div class="sinfo">
        <div class="sbldg" id="sBldg"></div>
        <div class="srtags" id="sRoomInfo" style="display:none">
          <span class="srtag" id="sTagBldg"></span>
          <span class="srtag" id="sTagFloor"></span>
          <span class="srtag" id="sTagRoom" style="display:none"></span>
        </div>
        <div class="sdist" id="sDist"></div>
        <div class="seta" id="sEta"></div>
      </div>
      <button class="xcl" onclick="cancelJourney()">✕</button>
    </div>
  </div>
  <div id="satView"><div id="map"></div></div>
  <div id="view3d">
    <canvas id="c3d"></canvas>
    <div id="loading3d">
      <div class="ldspin"></div>
      <div class="ldtxt">جاري تحميل النموذج ثلاثي الأبعاد</div>
      <div class="ldsub" id="ldpct">0%</div>
      <div style="width:180px;height:4px;background:rgba(212,175,55,.15);border-radius:2px;margin:10px auto 0">
        <div id="ldbar" style="height:100%;width:0%;background:var(--gold);border-radius:2px;transition:width .2s"></div>
      </div>
    </div>
    <div class="hint3d">اسحب للتدوير &bull; ضغطتان للتكبير &bull; اضغط مبنى للمعلومات</div>
  </div>
  <div class="icard" id="icard">
    <div class="ichdr">
      <div class="icnum" id="icnum"></div>
      <div><div class="icname" id="icname"></div><div class="iccat" id="iccat"></div></div>
    </div>
    <div class="icdet" id="icdet"></div>
    <div class="icmeta">
      <div class="ibadge"><div class="bv" id="mdist">—</div><div class="bl">المسافة (م)</div></div>
      <div class="ibadge"><div class="bv" id="meta">—</div><div class="bl">وقت الوصول</div></div>
    </div>
    <button class="gobtn" id="gobtn" onclick="startJourney()">انطلاق للوجهة &#x27A4;</button>
    <div id="parkChoices" style="display:none">
      <button class="pchoice" id="pchoice1" onclick="pickParking('p1')"></button>
      <button class="pchoice" id="pchoice2" onclick="pickParking('p2')"></button>
    </div>
  </div>
  <div class="sctrl">
    <button class="bs" id="btn3d" style="opacity:.45;cursor:not-allowed" title="قريباً">3D</button>
    <button class="bs" id="btnGPS" onclick="centerOnUser()">&#x1F3AF;</button>
    <button class="bs" onclick="doZoom(1)">+</button>
    <button class="bs" onclick="doZoom(-1)">&minus;</button>
    <button class="bs" onclick="location.reload()">&#x21BA;</button>
  </div>
  <div class="appsig">م/ عادل الشمري</div>
</div>
<div id="arrival">
  <span class="aricon">&#x2713;</span>
  <div class="artitle">وصلت إلى وجهتك</div>
  <div class="arsub" id="arsub"></div>
  <button class="arclose" onclick="dismissArrival()">إغلاق</button>
</div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';

const CC=[31.3893496,37.3102727],WS=80;
const BLDGS={
  "1":{name:"مبنى 1 - الأنشطة والمسرح",dept:"قسم الأنشطة",gps:[31.3885802,37.3098097],clr:"#7f8c8d",fl:1},
  "2":{name:"مبنى 2 - قسم الحاسب والشبكات",dept:"قسم الحاسب والشبكات",gps:[31.3884981,37.3106472],clr:"#5d6d7e",fl:3},
  "3":{name:"مبنى 3 - الدراسات العامة",dept:"قسم الدراسات العامة",gps:[31.3888144,37.3111052],clr:"#6e6e6e",fl:3},
  "4":{name:"مبنى 4 - الكافتيريا",dept:"الكافتيريا والبوفيه",gps:[31.3892940,37.3111964],clr:"#8c7853",fl:1},
  "5":{name:"مبنى 5 - المصلى والجامع",dept:"المصلى والجامع",gps:[31.3896953,37.3114700],clr:"#3a7a55",fl:1},
  "6":{name:"مبنى 6 - ورش الميكانيكا",dept:"قسم الميكانيكا",gps:[31.3903633,37.3105369],clr:"#7a6c5a",fl:1},
  "7":{name:"مبنى 7 - التقنية الميكانيكية",dept:"قسم التقنية الميكانيكية",gps:[31.3904349,37.3098989],clr:"#4a7a6a",fl:3},
  "8":{name:"مبنى 8 - العمادة",dept:"عمادة الكلية",gps:[31.3898115,37.3093759],clr:"#8a7a4a",fl:2}
};
const KW={"بوفيه":"4","كافتيريا":"4","كافيتريا":"4","كافيتيريا":"4","مطعم":"4","فطور":"4","مصلى":"5","مسجد":"5","جامع":"5","صلاة":"5","عمادة":"8","مسرح":"1","أنشطة":"1","شبكات":"2","دعم":"2","انظمة":"2","محاسبة":"3","دراسات":"3","ميكانيكا":"7","ورش":"6","ورشة":"6","تقنية":"7","سيارات":"7","تبريد":"7","تكييف":"7","محركات":"7","مركبات":"7","حاسب":"2"};
const KWF={"شؤون المتدربين":{b:"8",f:"1"},"شؤون طلاب":{b:"8",f:"1"},"شؤون":{b:"8",f:"1"},"متدربين":{b:"8",f:"1"},"مكتبة":{b:"1",f:"1"},"مكتبه":{b:"1",f:"1"},"قرطاسية":{b:"1",f:"1"},"قرطاسيه":{b:"1",f:"1"}};
const POI={
  "p1":{name:"موقف المتدربين الشمالي",dept:"مواقف المتدربين",gps:[31.3913046,37.3110640],clr:"#2980b9",icon:"P"},
  "p2":{name:"موقف المتدربين الجنوبي",dept:"مواقف المتدربين",gps:[31.3882877,37.3122720],clr:"#2980b9",icon:"P"},
  "sp1":{name:"موقف الإداريين والموظفين والزوار",dept:"مواقف الموظفين والإداريين",gps:[31.3903344,37.3090231],clr:"#8e44ad",icon:"P"},
  "sp2":{name:"موقف المدربين",dept:"مواقف المدربين",gps:[31.3880682,37.3099441],clr:"#8e44ad",icon:"P"},
  "g1":{name:"بوابة دخول المتدربين",dept:"بوابات الكلية",gps:[31.3933409,37.3124819],clr:"#27ae60",icon:"B"},
  "g2":{name:"بوابة دخول الإداريين والموظفين والزوار",dept:"بوابات الكلية",gps:[31.3889809,37.3087794],clr:"#e67e22",icon:"B"},
  "field1":{name:"ملعب الكلية",dept:"المرافق الرياضية",gps:[31.3899958,37.3128087],clr:"#27ae60",icon:"⚽"},
};
const KW_POI={
  "موقف المتدربين الشمالي":"p1","موقف شمالي":"p1",
  "موقف المتدربين الجنوبي":"p2","موقف جنوبي":"p2",
  "موقف الإداريين والموظفين":"sp1","موقف الزوار":"sp1","موقف الإداريين":"sp1",
  "موقف المدربين":"sp2","موقف موظفين":"sp1",
  "موقف المتدربين":"parking_student","مواقف المتدربين":"parking_student",
  "مواقف المدربين":"parking_staff","مواقف الموظفين":"parking_staff","مواقف الإداريين":"parking_staff",
  "موقف":"parking_student","مواقف":"parking_student","باركينج":"parking_student","ركن":"parking_student",
  "بوابة المتدربين":"g1","دخول المتدربين":"g1","مدخل المتدربين":"g1",
  "بوابة الإداريين":"g2","بوابة الموظفين":"g2","بوابة الزوار":"g2","بوابة المدربين":"g2",
  "بوابة":"gates_choice","مدخل":"gates_choice","دخول":"gates_choice","بوابه":"gates_choice",
  "ملعب الكلية":"field1","ملعب كرة قدم":"field1","ملعب كرة":"field1","ملعب":"field1","كرة قدم":"field1","ملاعب":"field1",
};
const LM=111000,LG=111000*Math.cos(CC[0]*Math.PI/180);
function toXZ(g){return{x:(g[1]-CC[1])*LG,z:-(g[0]-CC[0])*LM};}

let map,uMark,dMark,routeLine,isNav=false,arrived=false,lastGPS=null,hdg=0,dest=null,is3D=false;

function initMap(){
  map=L.map('map',{zoomControl:false,maxZoom:20}).setView(CC,18);
  L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:20}).addTo(map);
}
function onOrient(e){hdg=e.webkitCompassHeading||(360-e.alpha);document.querySelectorAll('.ubeam').forEach(b=>b.style.transform=`rotate(${hdg}deg)`);}
function centerOnUser(){if(lastGPS&&map)map.setView(lastGPS,19);}
function onGPS(pos){
  lastGPS=[pos.coords.latitude,pos.coords.longitude];
  const ic=`<div style="position:relative"><div class="pring"></div><div class="udot"><div class="ubeam" style="transform:rotate(${hdg}deg)"></div></div></div>`;
  const icon=L.divIcon({className:'',html:ic,iconSize:[20,20],iconAnchor:[10,10]});
  if(!uMark)uMark=L.marker(lastGPS,{icon,zIndexOffset:1000}).addTo(map);
  else{uMark.setLatLng(lastGPS);uMark.setIcon(icon);}
  if(dMark&&dest){const d=map.distance(lastGPS,dMark.getLatLng());drawRoute(lastGPS,dMark.getLatLng(),d);
    if(isNav){map.setView(lastGPS,map.getZoom());if(d<10&&!arrived){arrived=true;showArrival();}}}
  upd3DUser();
}
function drawRoute(a,b,d){
  if(routeLine)map.removeLayer(routeLine);
  routeLine=L.polyline([a,b],{color:'#d4af37',weight:7,opacity:.85,dashArray:'1,15'}).addTo(map);
  if(isNav&&d!=null){document.getElementById('sDist').textContent=d<6?'وصلت إلى وجهتك':Math.round(d)+' متر';
    document.getElementById('sEta').textContent=d<6?'':'الوقت المتوقع: ~'+Math.max(1,Math.round(d/WS))+' دقيقة';}
}

/* ═══ Three.js ═══ */
let R3,S3,C3;
let cTh=0.55,cPh=0.85,cR=420,cTgt=new THREE.Vector3();
let tdrag=false,tpinch=false,td0={x:0,y:0},tdist=0;
let camAnim=null,selId=null,prevT=0;
const bMeshes={};
let navPath=null,navDot=null,navDotT=0,navCurve=null,uDot3=null;
let glbLoaded=false,glbLoading=false;

const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0.5?2*t*t:-1+(4-2*t)*t;

function init3D(){
  const cv=document.getElementById('c3d');
  R3=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  R3.setPixelRatio(Math.min(devicePixelRatio,2));
  R3.shadowMap.enabled=true;R3.shadowMap.type=THREE.PCFSoftShadowMap;
  R3.toneMapping=THREE.ACESFilmicToneMapping;R3.toneMappingExposure=1.1;
  S3=new THREE.Scene();S3.background=new THREE.Color(0x9fd4e8);S3.fog=new THREE.FogExp2(0xb8d8e8,0.0010);
  C3=new THREE.PerspectiveCamera(50,1,0.5,1500);setCam();
  S3.add(new THREE.AmbientLight(0xfff5e0,0.72));
  const sun=new THREE.DirectionalLight(0xfff0cc,1.55);
  sun.position.set(220,500,180);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=1100;
  sun.shadow.camera.left=-320;sun.shadow.camera.right=320;sun.shadow.camera.top=320;sun.shadow.camera.bottom=-320;
  S3.add(sun);
  const fill=new THREE.DirectionalLight(0xb8d8ff,0.28);fill.position.set(-200,120,-150);S3.add(fill);
  const bounce=new THREE.DirectionalLight(0xffe8b8,0.18);bounce.position.set(0,-1,0);S3.add(bounce);
  resize3D();window.addEventListener('resize',resize3D);bindTouch(cv);renderLoop();
}

function setCam(){
  const x=cR*Math.sin(cPh)*Math.sin(cTh),y=cR*Math.cos(cPh),z=cR*Math.sin(cPh)*Math.cos(cTh);
  C3.position.set(cTgt.x+x,cTgt.y+y,cTgt.z+z);C3.lookAt(cTgt);
}

function renderLoop(t=0){
  requestAnimationFrame(renderLoop);
  const dt=Math.min((t-prevT)/1000,0.05);prevT=t;
  if(camAnim){
    camAnim.t=Math.min(1,camAnim.t+dt/camAnim.dur);
    const e=ease(camAnim.t);
    cTh=lerp(camAnim.sTh,camAnim.eTh,e);cPh=lerp(camAnim.sPh,camAnim.ePh,e);
    cR=lerp(camAnim.sR,camAnim.eR,e);cTgt.lerpVectors(camAnim.sTgt,camAnim.eTgt,e);
    setCam();if(camAnim.t>=1)camAnim=null;
  }
  if(navDot&&navCurve&&navDot.visible){
    navDotT=(navDotT+dt*0.22)%1;
    navCurve.getPoint(navDotT,navDot.position);
    navDot.scale.setScalar(1+0.35*Math.sin(navDotT*Math.PI*12));
  }
  if(selId&&bMeshes[selId]){
    const p=0.22+0.18*Math.sin(t*0.004);
    bMeshes[selId].forEach(m=>{if(m.material&&m.material._hl)m.material.emissiveIntensity=p;});
  }
  R3.render(S3,C3);
}

function resize3D(){if(!R3)return;R3.setSize(innerWidth,innerHeight);C3.aspect=innerWidth/innerHeight;C3.updateProjectionMatrix();}

function loadGLB(cb){
  if(glbLoaded){cb&&cb();return;}
  if(glbLoading)return;
  glbLoading=true;
  document.getElementById('loading3d').style.display='block';
  const draco=new DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
  const loader=new GLTFLoader();
  loader.setDRACOLoader(draco);
  loader.load('./campus.glb',gltf=>{
    S3.add(gltf.scene);
    gltf.scene.traverse(obj=>{
      if(!obj.isMesh)return;
      const m=obj.name.match(/^B(\d)/);
      if(m){const id=m[1];if(!bMeshes[id])bMeshes[id]=[];bMeshes[id].push(obj);obj.castShadow=true;obj.receiveShadow=true;}
    });
    glbLoaded=true;glbLoading=false;
    document.getElementById('loading3d').style.display='none';
    cb&&cb();
  },xhr=>{
    if(xhr.lengthComputable){const p=Math.round(xhr.loaded/xhr.total*100);
      document.getElementById('ldpct').textContent=p+'%';
      document.getElementById('ldbar').style.width=p+'%';}
  },err=>{console.error('GLB:',err);glbLoading=false;});
}

function flyToBuilding(id){
  const p=toXZ(BLDGS[id].gps);const angle=Math.atan2(p.x,p.z);
  camAnim={sTh:cTh,sPh:cPh,sR:cR,sTgt:cTgt.clone(),eTh:angle-0.5,ePh:0.8,eR:145,eTgt:new THREE.Vector3(p.x*0.35,0,p.z*0.35),t:0,dur:1.6};
}

function highlightBuilding(id){
  if(selId&&bMeshes[selId]){
    bMeshes[selId].forEach(m=>{if(m.material&&m.material._hl){m.material.dispose();m.material=m.userData.orig;}});
  }
  selId=id;
  if(!bMeshes[id])return;
  bMeshes[id].forEach(m=>{
    if(!m.userData.orig)m.userData.orig=m.material;
    const hl=m.userData.orig.clone();
    if(hl.emissive)hl.emissive.set(0x8a6a18);else hl.emissive=new THREE.Color(0x8a6a18);
    hl.emissiveIntensity=0.35;hl._hl=true;m.material=hl;
  });
}

function draw3DNavPath(){
  if(!dest)return;
  if(navPath){S3.remove(navPath);navPath.geometry.dispose();navPath=null;}
  const from=lastGPS?toXZ(lastGPS):{x:0,z:0};
  const to=toXZ((dest.poi||dest.b).gps);
  const pts=[];
  for(let i=0;i<=40;i++){const t=i/40;pts.push(new THREE.Vector3(from.x+(to.x-from.x)*t,2+Math.sin(t*Math.PI)*14,from.z+(to.z-from.z)*t));}
  navCurve=new THREE.CatmullRomCurve3(pts);
  const geo=new THREE.TubeGeometry(navCurve,80,0.7,6,false);
  const mat=new THREE.MeshBasicMaterial({color:0xd4af37,transparent:true,opacity:0.9});
  navPath=new THREE.Mesh(geo,mat);S3.add(navPath);
  if(!navDot){navDot=new THREE.Mesh(new THREE.SphereGeometry(2.2,12,8),new THREE.MeshBasicMaterial({color:0xffffff}));S3.add(navDot);}
  navDot.visible=true;navDotT=0;
}

function clear3DNavPath(){
  if(navPath){S3.remove(navPath);navPath.geometry.dispose();navPath=null;}
  if(navDot)navDot.visible=false;navCurve=null;
}

function upd3DUser(){
  if(!lastGPS||!S3)return;
  const p=toXZ(lastGPS);
  if(!uDot3){
    uDot3=new THREE.Mesh(new THREE.SphereGeometry(3.5,16,8),new THREE.MeshLambertMaterial({color:0x2196F3,emissive:new THREE.Color(0x0d47a1),emissiveIntensity:0.5}));
    S3.add(uDot3);
  }
  uDot3.position.set(p.x,3.5,p.z);
  if(isNav&&dest)draw3DNavPath();
}

function bindTouch(cv){
  cv.addEventListener('touchstart',e=>{e.preventDefault();
    if(e.touches.length===1){tdrag=true;tpinch=false;td0={x:e.touches[0].clientX,y:e.touches[0].clientY};}
    else if(e.touches.length===2){tpinch=true;tdrag=false;tdist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);}
  },{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();
    if(tdrag&&e.touches.length===1){
      cTh-=(e.touches[0].clientX-td0.x)*0.007;cPh=Math.max(0.12,Math.min(1.45,cPh+(e.touches[0].clientY-td0.y)*0.006));
      td0={x:e.touches[0].clientX,y:e.touches[0].clientY};setCam();camAnim=null;
    }else if(tpinch&&e.touches.length===2){
      const d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      cR=Math.max(50,Math.min(600,cR-(d-tdist)*1.3));tdist=d;setCam();camAnim=null;
    }
  },{passive:false});
  cv.addEventListener('touchend',()=>{tdrag=false;tpinch=false;});
  cv.addEventListener('click',e=>pick3D(e,cv));
}

const RAY=new THREE.Raycaster(),PTR=new THREE.Vector2();
function pick3D(e,cv){
  const rc=cv.getBoundingClientRect();
  PTR.x=((e.clientX-rc.left)/rc.width)*2-1;PTR.y=-((e.clientY-rc.top)/rc.height)*2+1;
  RAY.setFromCamera(PTR,C3);
  let hit=null,hitD=Infinity;
  S3.traverse(obj=>{if(!obj.isMesh||!obj.name.match(/^B\d/))return;
    const hs=RAY.intersectObject(obj,false);if(hs.length&&hs[0].distance<hitD){hit=obj;hitD=hs[0].distance;}});
  if(hit){const m=hit.name.match(/^B(\d)/);if(m)selBldg(m[1]);}
}
function selBldg(id){highlightBuilding(id);flyToBuilding(id);executeSearch(id,'key',null);}

function toggle3D(){
  is3D=!is3D;
  document.getElementById('satView').style.display=is3D?'none':'block';
  document.getElementById('view3d').style.display=is3D?'block':'none';
  document.getElementById('btn3d').classList.toggle('on',is3D);
  document.getElementById('btnGPS').style.display=is3D?'none':'flex';
  if(is3D){resize3D();loadGLB(()=>{if(isNav&&dest){draw3DNavPath();if(dest.bId)flyToBuilding(dest.bId);}});}
}

async function startApp(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{if((await DeviceOrientationEvent.requestPermission())==='granted')window.addEventListener('deviceorientation',onOrient);}catch(e){}
  }else window.addEventListener('deviceorientation',onOrient);
  const w=document.getElementById('welcome');w.style.opacity='0';
  setTimeout(()=>{w.style.display='none';document.getElementById('app').style.display='flex';
    initMap();init3D();navigator.geolocation?.watchPosition(onGPS,null,{enableHighAccuracy:true,timeout:10000,maximumAge:0});},800);
}

document.getElementById('roomInput').addEventListener('input',function(e){
  const v=e.target.value.trim(),u=v.toUpperCase();
  for(const k in KW_POI){if(v.includes(k)){executePOI(KW_POI[k]);return;}}
  for(const k in KWF){if(v.includes(k)){const d=KWF[k];executeSearch(d.b,'floor',{f:d.f});return;}}
  for(const k in KW){if(v.includes(k)){executeSearch(KW[k],'key',k);return;}}
  if(u.length===10){const bId=u[4],fl=u[5],c7=u[6],c8=u[7],isWS=isNaN(u[9]);
    const NO_ROOMS={'1':'الأنشطة والمسرح','4':'الكافتيريا','5':'المصلى والجامع','8':'العمادة والإدارة'};
    if(NO_ROOMS[bId]){showToast(`مبنى ${bId} — ${NO_ROOMS[bId]} — لا توجد قاعات دراسية`);return;}
    if(isWS){if(fl!==c7){showToast('تنبيه: رقم الدور غير متطابق');return;}}
    else{if(fl!==c8){showToast('تنبيه: رقم الدور غير متطابق');return;}}
    executeSearch(bId,isWS?'workshop':'code',{f:fl,r:u.substring(isWS?6:7)});}
});

function executeSearch(bId,type,data){
  const b=BLDGS[bId];if(!b)return;
  isNav=false;arrived=false;dest={bId,b,navType:type,navData:data};
  document.getElementById('statusBar').style.display='none';
  resetCardMode();
  const ne=document.getElementById('icnum');
  ne.textContent=bId;ne.style.background=b.clr+'22';ne.style.color=b.clr;ne.style.border='2px solid '+b.clr+'44';
  document.getElementById('icname').textContent=b.name;
  document.getElementById('iccat').textContent=b.dept;
  const fN={"0":"الأرضي","1":"الأول","2":"الثاني","3":"الثالث"};
  let det='';
  if(type==='key'||!data)det=`<b>القسم:</b> ${b.dept}<br><b>عدد الأدوار:</b> ${b.fl} ${b.fl===1?'دور':'أدوار'}`;
  else if(type==='floor')det=`<b>القسم:</b> ${b.dept}<br><b>الدور:</b> ${fN[data.f]||data.f}`;
  else{const roomNum=data.r.replace(/[A-Za-z]+$/,'');
    det=`<b>الدور:</b> ${fN[data.f]||data.f}<br><b>رقم القاعة:</b> ${roomNum}`;}
  document.getElementById('icdet').innerHTML=det;
  if(lastGPS&&map&&!is3D){
    const d=map.distance(lastGPS,b.gps),eta=Math.max(1,Math.round(d/WS));
    document.getElementById('mdist').textContent=Math.round(d);document.getElementById('meta').textContent=eta+' د';
    if(dMark)map.removeLayer(dMark);
    dMark=L.marker(b.gps,{icon:L.divIcon({className:'',
      html:`<div style="width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid ${b.clr};box-shadow:0 0 12px ${b.clr}99"></div>`,
      iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map).bindPopup(b.name).openPopup();
    map.flyTo(b.gps,19);drawRoute(lastGPS,b.gps,d);
  }else{document.getElementById('mdist').textContent='—';document.getElementById('meta').textContent='—';}
  if(is3D){highlightBuilding(bId);flyToBuilding(bId);}
  document.getElementById('icard').style.display='block';
}

function resetCardMode(){
  document.getElementById('gobtn').style.display='block';
  document.getElementById('parkChoices').style.display='none';
}

function showParkingChoice(pids,label,clr){
  isNav=false;arrived=false;dest=null;
  document.getElementById('statusBar').style.display='none';
  const isGate=pids[0]==='g1'||pids[0]==='g2';
  const ne=document.getElementById('icnum');
  ne.textContent=isGate?'B':'P';ne.style.background=clr+'22';ne.style.color=clr;ne.style.border='2px solid '+clr+'44';
  document.getElementById('icname').textContent=label;
  document.getElementById('iccat').textContent=isGate?'اختر البوابة المناسبة':'اختر الموقف المناسب';
  document.getElementById('icdet').innerHTML=isGate?'بوابتان متاحتان — اضغط إحداهما للانطلاق فوراً':'موقفان متاحان — اضغط أحدهما للانطلاق فوراً';
  document.getElementById('mdist').textContent='—';document.getElementById('meta').textContent='—';
  pids.forEach((pid,i)=>{
    const p=POI[pid],btn=document.getElementById(`pchoice${i+1}`);
    let dist='';
    if(lastGPS&&map){const d=map.distance(lastGPS,p.gps);dist=`<div class="pcdist">${Math.round(d)} م &bull; ~${Math.max(1,Math.round(d/WS))} د مشياً</div>`;}
    btn.innerHTML=`<div class="pclabel">${p.name}</div>${dist}`;
    btn.onclick=()=>window.pickParking(pid);
  });
  document.getElementById('gobtn').style.display='none';
  document.getElementById('parkChoices').style.display='flex';
  document.getElementById('icard').style.display='block';
}

function pickParking(pid){
  resetCardMode();
  executePOI(pid);
}

function executePOI(pid){
  if(pid==='parking_student'){showParkingChoice(['p1','p2'],'مواقف المتدربين','#2980b9');return;}
  if(pid==='parking_staff'){showParkingChoice(['sp1','sp2'],'مواقف الموظفين والمدربين','#8e44ad');return;}
  if(pid==='gates_choice'){showParkingChoice(['g1','g2'],'بوابات الكلية','#27ae60');return;}
  const p=POI[pid];if(!p)return;
  isNav=false;arrived=false;dest={poiId:pid,poi:p};
  document.getElementById('statusBar').style.display='none';
  resetCardMode();
  const ne=document.getElementById('icnum');
  ne.textContent=p.icon;ne.style.background=p.clr+'22';ne.style.color=p.clr;ne.style.border='2px solid '+p.clr+'44';
  document.getElementById('icname').textContent=p.name;
  document.getElementById('iccat').textContent=p.dept;
  document.getElementById('icdet').innerHTML=`<b>النوع:</b> ${p.dept}<br><b>الموقع:</b> داخل الحرم الجامعي`;
  if(lastGPS&&map&&!is3D){
    const d=map.distance(lastGPS,p.gps),eta=Math.max(1,Math.round(d/WS));
    document.getElementById('mdist').textContent=Math.round(d);document.getElementById('meta').textContent=eta+' د';
    if(dMark)map.removeLayer(dMark);
    dMark=L.marker(p.gps,{icon:L.divIcon({className:'',
      html:`<div style="width:22px;height:22px;border-radius:6px;background:${p.clr};border:2px solid #fff;box-shadow:0 0 12px ${p.clr}99;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.75rem">${p.icon}</div>`,
      iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindPopup(p.name).openPopup();
    map.flyTo(p.gps,19);drawRoute(lastGPS,p.gps,d);
  }else{document.getElementById('mdist').textContent='—';document.getElementById('meta').textContent='—';}
  document.getElementById('icard').style.display='block';
}

function startJourney(){
  if(!dest)return;isNav=true;arrived=false;
  document.getElementById('icard').style.display='none';
  document.getElementById('statusBar').style.display='block';
  const tgt=dest.poi||dest.b;
  document.getElementById('sBldg').textContent=tgt.name;
  const fN={"0":"الأرضي","1":"الأول","2":"الثاني","3":"الثالث"};
  const infoEl=document.getElementById('sRoomInfo');
  const tagRoom=document.getElementById('sTagRoom');
  if(dest.bId&&dest.navType&&dest.navType!=='key'&&dest.navData){
    document.getElementById('sTagBldg').textContent='مبنى '+dest.bId;
    document.getElementById('sTagFloor').textContent='الدور: '+(fN[dest.navData.f]||dest.navData.f);
    if((dest.navType==='code'||dest.navType==='workshop')&&dest.navData.r){
      tagRoom.textContent='قاعة: '+dest.navData.r.replace(/[A-Za-z]+$/,'');
      tagRoom.style.display='';
    }else{tagRoom.style.display='none';}
    infoEl.style.display='flex';
  }else{infoEl.style.display='none';}
  if(lastGPS&&map){
    if(dMark)map.removeLayer(dMark);
    dMark=L.marker(tgt.gps,{icon:L.divIcon({className:'',
      html:`<div style="width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid ${tgt.clr};box-shadow:0 0 12px ${tgt.clr}99"></div>`,
      iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);
    drawRoute(lastGPS,tgt.gps,map.distance(lastGPS,tgt.gps));}
}

function cancelJourney(){
  isNav=false;document.getElementById('statusBar').style.display='none';
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}if(dMark){map.removeLayer(dMark);dMark=null;}
  dest=null;arrived=false;document.getElementById('roomInput').value='';
  clear3DNavPath();
  if(selId&&bMeshes[selId]){bMeshes[selId].forEach(m=>{if(m.material&&m.material._hl){m.material.dispose();m.material=m.userData.orig;}});selId=null;}
}

function showArrival(){
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,500]);
  document.getElementById('arsub').textContent=(dest?.poi||dest?.b)?.dept||'';
  document.getElementById('arrival').classList.add('show');
  document.getElementById('sDist').textContent='وصلت إلى وجهتك';document.getElementById('sEta').textContent='';
}
function dismissArrival(){document.getElementById('arrival').classList.remove('show');}
let _tt;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2600);}

window.startApp=startApp;window.toggle3D=toggle3D;window.startJourney=startJourney;
window.cancelJourney=cancelJourney;window.centerOnUser=centerOnUser;window.dismissArrival=dismissArrival;
window.pickParking=pickParking;
window.doZoom=function(dir){if(map){if(dir>0)map.zoomIn();else map.zoomOut();}};
</script>
