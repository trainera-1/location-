<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0b0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>بوصلة المتدرب التقني - م/ عادل الشمري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--gold:#d4af37;--gold-l:#f1d279;--gold-d:#aa8c2c;--bg:#0b0b0b;--green:#27ae60;--font:'Tajawal',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;font-family:var(--font);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
#welcome{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at 50% 20%,#1c1600,#000 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity .8s;overflow:hidden}
.orb{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(212,175,55,.18),transparent 70%);animation:orbp 5s ease-in-out infinite}
.orb1{width:320px;height:320px;top:-100px;right:-80px}.orb2{width:220px;height:220px;bottom:60px;left:-60px;animation-delay:2s}.orb3{width:160px;height:160px;bottom:200px;right:10px;animation-delay:4s}
@keyframes orbp{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.25);opacity:.75}}
.wlogo{width:88px;height:88px;background:linear-gradient(135deg,var(--gold-d),var(--gold-l));border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:22px;z-index:1;box-shadow:0 0 50px rgba(212,175,55,.5);animation:flt 3.5s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wtitle{font-size:2.6rem;font-weight:900;background:linear-gradient(to bottom,#f9e49a,#d4af37 50%,#7a5e10);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;z-index:1;margin-bottom:10px;line-height:1.25}
.wsub{color:#777;font-size:1rem;line-height:1.7;z-index:1;margin-bottom:38px}.wsub span{color:var(--gold);font-weight:700}
.wbtn{background:linear-gradient(135deg,var(--gold-d),var(--gold-l));color:#000;border:none;padding:16px 64px;border-radius:50px;font-size:1.2rem;font-weight:900;cursor:pointer;font-family:var(--font);z-index:1;box-shadow:0 6px 28px rgba(212,175,55,.55);transition:transform .15s}
.wbtn:active{transform:scale(.96)}
.wsig{position:absolute;bottom:22px;color:#444;font-size:.85rem;z-index:1}.wsig span{color:var(--gold-d)}
#app{display:none;height:100%;flex-direction:column;position:relative}
.snav{position:absolute;top:15px;left:12px;right:12px;z-index:2000;background:rgba(0,0,0,.92);padding:4px;border-radius:16px;border:2px solid var(--gold);backdrop-filter:blur(10px)}
#roomInput{width:100%;padding:13px;border:none;font-size:1.1rem;text-align:center;background:transparent;color:var(--gold-l);outline:none;font-weight:700;font-family:var(--font)}
#roomInput::placeholder{color:#444;font-weight:500}
#statusBar{position:absolute;top:88px;left:12px;right:12px;z-index:1999;background:rgba(0,0,0,.9);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;display:none;backdrop-filter:blur(8px)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px}.sinfo{flex:1}
.sbldg{color:var(--gold-l);font-weight:800;font-size:.92rem}.sdist{color:var(--green);font-size:.82rem;margin-top:3px;font-weight:700}.seta{color:#888;font-size:.75rem;margin-top:2px}
.xcl{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.4);color:#e74c3c;width:36px;height:36px;border-radius:8px;font-size:1rem;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#satView{position:absolute;inset:0;z-index:1}#map{width:100%;height:100%}
#view3d{position:absolute;inset:0;z-index:2;display:none}
#c3d{width:100%;height:100%;display:block;touch-action:none}
.hint3d{position:absolute;top:88px;left:12px;right:12px;z-index:10;background:rgba(0,0,0,.7);color:#999;font-size:.78rem;padding:8px 14px;border-radius:20px;border:1px solid #333;text-align:center;pointer-events:none}
.icard{position:absolute;bottom:22px;left:12px;right:12px;z-index:3000;background:rgba(14,14,14,.98);border:1px solid rgba(212,175,55,.22);border-radius:20px;padding:20px;display:none;box-shadow:0 -5px 30px rgba(0,0,0,.7);backdrop-filter:blur(10px)}
.ichdr{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.icnum{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900}
.icname{color:var(--gold-l);font-size:1.05rem;font-weight:900;line-height:1.35}.iccat{color:#555;font-size:.8rem;margin-top:4px;font-weight:500}
.icdet{color:#aaa;font-size:.9rem;line-height:1.85;background:rgba(255,255,255,.03);border-radius:10px;padding:12px 14px;border:1px solid rgba(255,255,255,.06)}
.icdet b{color:#ccc;font-weight:700}
.icmeta{display:flex;gap:10px;margin-top:12px}
.ibadge{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;text-align:center}
.bv{color:var(--gold);font-size:1.15rem;font-weight:900}.bl{color:#444;font-size:.72rem;margin-top:3px}
.gobtn{background:linear-gradient(135deg,#1a6e2e,var(--green));color:#fff;border:none;padding:15px;border-radius:12px;font-weight:900;width:100%;margin-top:14px;font-size:1.05rem;cursor:pointer;font-family:var(--font);letter-spacing:.3px}
.sctrl{position:absolute;top:50%;right:15px;transform:translateY(-50%);z-index:2000;display:flex;flex-direction:column;gap:10px}
.bs{background:rgba(0,0,0,.88);color:var(--gold);border:1.5px solid rgba(212,175,55,.45);width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;font-family:var(--font);backdrop-filter:blur(6px);transition:all .15s;font-weight:700}
.bs:active{background:rgba(212,175,55,.12);transform:scale(.93)}.bs.on{background:rgba(212,175,55,.18);border-color:var(--gold)}
.udot{position:relative;width:20px;height:20px;background:#2196F3;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(33,150,243,.7)}
.ubeam{position:absolute;top:-45px;left:-15px;width:50px;height:50px;background:radial-gradient(ellipse at bottom,rgba(33,150,243,.6),transparent 70%);clip-path:polygon(50% 100%,0% 0%,100% 0%);transform-origin:bottom center;pointer-events:none;transition:transform .2s}
@keyframes pr{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.5);opacity:0}}
.pring{position:absolute;width:20px;height:20px;border-radius:50%;background:rgba(33,150,243,.25);animation:pr 2s ease-out infinite;top:0;left:0;pointer-events:none}
#arrival{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:9500;background:linear-gradient(135deg,#155724,var(--green));border-radius:24px;padding:34px 44px;text-align:center;box-shadow:0 0 70px rgba(39,174,96,.7);transition:transform .45s cubic-bezier(.175,.885,.32,1.275);min-width:260px}
#arrival.show{transform:translate(-50%,-50%) scale(1)}
.aricon{font-size:3rem;display:block;margin-bottom:12px;color:#fff}
.artitle{color:#fff;font-size:1.5rem;font-weight:900}.arsub{color:rgba(255,255,255,.8);font-size:.92rem;margin-top:6px}
.arclose{margin-top:22px;background:rgba(255,255,255,.18);border:none;color:#fff;padding:11px 34px;border-radius:30px;font-family:var(--font);font-size:1rem;cursor:pointer;font-weight:700}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(16px);background:rgba(0,0,0,.92);color:#fff;padding:11px 24px;border-radius:30px;font-size:.9rem;z-index:8000;opacity:0;transition:all .3s;pointer-events:none;border:1px solid rgba(212,175,55,.3);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.appsig{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);color:var(--gold);font-weight:700;font-size:.95rem;z-index:2000;pointer-events:none;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.8)}
</style>
</head>
<body>
<div id="welcome">
  <div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
  <div class="wlogo">🧭</div>
  <h1 class="wtitle">بوصلة المتدرب التقني</h1>
  <p class="wsub">مرحباً بك في<br><span>الكلية التقنية بالقريات</span><br>دليلك الذكي للوصول بدقة واحترافية</p>
  <button class="wbtn" onclick="startApp()">ابدأ الآن</button>
  <div class="wsig">من إعداد: <span>م/ عادل الشمري</span></div>
</div>
<div id="app">
  <div class="snav"><input type="text" id="roomInput" placeholder="🔍  بحث (مصلى، مسرح، رقم القاعة...)" maxlength="20" autocomplete="off"></div>
  <div id="statusBar">
    <div class="srow">
      <div class="sinfo">
        <div class="sbldg">📍 <span id="sBldg"></span></div>
        <div class="sdist" id="sDist">جاري التحديد...</div>
        <div class="seta" id="sEta"></div>
      </div>
      <button class="xcl" onclick="cancelJourney()">✕</button>
    </div>
  </div>
  <div id="satView"><div id="map"></div></div>
  <div id="view3d">
    <canvas id="c3d"></canvas>
    <div class="hint3d">اسحب للتدوير &nbsp;|&nbsp; قرصة للتكبير &nbsp;|&nbsp; اضغط المبنى لعرض تفاصيله</div>
  </div>
  <div class="icard" id="icard">
    <div class="ichdr">
      <div class="icnum" id="icnum"></div>
      <div><div class="icname" id="icname"></div><div class="iccat" id="iccat"></div></div>
    </div>
    <div class="icdet" id="icdet"></div>
    <div class="icmeta">
      <div class="ibadge"><div class="bv" id="mdist">—</div><div class="bl">المسافة (م)</div></div>
      <div class="ibadge"><div class="bv" id="meta">—</div><div class="bl">وقت الوصول</div></div>
    </div>
    <button class="gobtn" onclick="startJourney()">انطلاق للوجهة</button>
  </div>
  <div class="sctrl">
    <button class="bs" id="btn3d" onclick="toggle3D()">3D</button>
    <button class="bs" id="btnGPS" onclick="centerOnUser()">🎯</button>
    <button class="bs" onclick="map&&map.zoomIn()">+</button>
    <button class="bs" onclick="map&&map.zoomOut()">−</button>
    <button class="bs" onclick="location.reload()">↺</button>
  </div>
  <div class="appsig">م/ عادل الشمري</div>
</div>
<div id="arrival">
  <span class="aricon">✓</span>
  <div class="artitle">وصلت إلى وجهتك</div>
  <div class="arsub" id="arsub"></div>
  <button class="arclose" onclick="dismissArrival()">إغلاق</button>
</div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const CC=[31.3893496,37.3102727],WS=80;
const BLDGS={
  "1":{name:"مبنى 1 - الأنشطة والمسرح",dept:"قسم الأنشطة",gps:[31.3885802,37.3098097],clr:"#7f8c8d",hex:0x95a5a6,fl:2,w:65,d:50},
  "2":{name:"مبنى 2 - قسم الحاسب والشبكات",dept:"قسم الحاسب والشبكات",gps:[31.3884981,37.3106472],clr:"#5d6d7e",hex:0x6d7f8e,fl:3,w:58,d:42},
  "3":{name:"مبنى 3 - الدراسات العامة",dept:"قسم الدراسات العامة",gps:[31.3888144,37.3111052],clr:"#6e6e6e",hex:0x7e8e9e,fl:3,w:58,d:45},
  "4":{name:"مبنى 4 - الكافتيريا",dept:"الكافتيريا والبوفيه",gps:[31.3892940,37.3111964],clr:"#8c7853",hex:0x9e8a6a,fl:1,w:40,d:32},
  "5":{name:"مبنى 5 - المصلى والجامع",dept:"المصلى والجامع",gps:[31.3896953,37.3114700],clr:"#3a7a55",hex:0x4a9a6a,fl:1,w:52,d:46},
  "6":{name:"مبنى 6 - ورش الميكانيكا",dept:"قسم الميكانيكا",gps:[31.3903633,37.3105369],clr:"#7a6c5a",hex:0x8a7c6a,fl:1,w:90,d:65},
  "7":{name:"مبنى 7 - التقنية الميكانيكية",dept:"قسم التقنية الميكانيكية",gps:[31.3904349,37.3098989],clr:"#4a7a6a",hex:0x5a8a7a,fl:3,w:65,d:50},
  "8":{name:"مبنى 8 - العمادة",dept:"عمادة الكلية",gps:[31.3898115,37.3093759],clr:"#8a7a4a",hex:0x9a8a5a,fl:2,w:58,d:50}
};
const KW={"بوفيه":"4","كافتيريا":"4","مصلى":"5","جامع":"5","عمادة":"8","شؤون":"8","مسرح":"1","أنشطة":"1","شبكات":"2","دعم":"2","محاسبة":"3","دراسات":"3","ميكانيكا":"6","ورش":"6","ورشة":"6","تقنية":"7","حاسب":"2"};
const LM=111000,LG=111000*Math.cos(CC[0]*Math.PI/180);
function toXZ(g){return{x:(g[1]-CC[1])*LG,z:-(g[0]-CC[0])*LM};}
let map,uMark,dMark,routeLine,isNav=false,arrived=false,lastGPS=null,hdg=0,dest=null,is3D=false;

async function startApp(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{if((await DeviceOrientationEvent.requestPermission())==='granted')window.addEventListener('deviceorientation',onOrient);}catch(e){}
  }else window.addEventListener('deviceorientation',onOrient);
  const w=document.getElementById('welcome');w.style.opacity='0';
  setTimeout(()=>{w.style.display='none';document.getElementById('app').style.display='flex';
    initMap();init3D();navigator.geolocation?.watchPosition(onGPS,null,{enableHighAccuracy:true,timeout:10000,maximumAge:0});},800);
}
function onOrient(e){hdg=e.webkitCompassHeading||(360-e.alpha);document.querySelectorAll('.ubeam').forEach(b=>b.style.transform=`rotate(${hdg}deg)`);}
function initMap(){map=L.map('map',{zoomControl:false,maxZoom:20}).setView(CC,18);L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:20}).addTo(map);}
function onGPS(pos){
  lastGPS=[pos.coords.latitude,pos.coords.longitude];
  const icon=L.divIcon({className:'',html:`<div style="position:relative"><div class="pring"></div><div class="udot"><div class="ubeam" style="transform:rotate(${hdg}deg)"></div></div></div>`,iconSize:[20,20],iconAnchor:[10,10]});
  if(!uMark)uMark=L.marker(lastGPS,{icon,zIndexOffset:1000}).addTo(map);
  else{uMark.setLatLng(lastGPS);uMark.setIcon(icon);}
  if(dMark&&dest){const d=map.distance(lastGPS,dMark.getLatLng());drawRoute(lastGPS,dMark.getLatLng(),d);
    if(isNav){map.setView(lastGPS,map.getZoom());if(d<10&&!arrived){arrived=true;showArrival();}}}
  upd3DUser();
}
function drawRoute(a,b,d){
  if(routeLine)map.removeLayer(routeLine);
  routeLine=L.polyline([a,b],{color:'#d4af37',weight:7,opacity:.85,dashArray:'1,15'}).addTo(map);
  if(isNav&&d!=null){document.getElementById('sDist').textContent=d<6?'وصلت إلى وجهتك':Math.round(d)+' متر';
    document.getElementById('sEta').textContent=d<6?'':'الوقت المتوقع: ~'+Math.max(1,Math.round(d/WS))+' دقيقة';}
}
function centerOnUser(){if(lastGPS&&map)map.setView(lastGPS,19);}

/* ═══ Three.js ═══ */
let R3,S3,C3,meshes={},selId=null,glowT=0;
let cTh=0.45,cPh=1.04,cR=310,cTgt=new THREE.Vector3(0,0,0);
let td0={x:0,y:0},tdist=0,tdrag=false,tpinch=false;

function mkWallTex(hex,floors){
  const W=512,H=512,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  const r=(hex>>16)&0xff,g=(hex>>8)&0xff,b=hex&0xff;
  const wr=Math.round(205+(r-128)*.12),wg=Math.round(192+(g-128)*.12),wb=Math.round(170+(b-128)*.12);
  ctx.fillStyle=`rgb(${wr},${wg},${wb})`;ctx.fillRect(0,0,W,H);
  if(floors>1){ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=2;
    for(let f=1;f<floors;f++){const y=(H/floors)*f;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,0.07)';ctx.fillRect(0,y-2,W,4);}}
  const cols=5,rows=floors*2,nw=(W/cols)*.5,nh=(H/rows)*.44;
  for(let row=0;row<rows;row++){for(let col=0;col<cols;col++){
    const nx=(W/cols)*(col+.25),ny=(H/rows)*(row+.28);
    const grd=ctx.createLinearGradient(nx,ny,nx,ny+nh);
    grd.addColorStop(0,'rgba(155,205,235,.85)');grd.addColorStop(1,'rgba(100,160,215,.65)');
    ctx.fillStyle=grd;ctx.fillRect(nx,ny,nw,nh);
    ctx.strokeStyle=`rgba(${wr-45},${wg-45},${wb-45},.8)`;ctx.lineWidth=1.5;ctx.strokeRect(nx,ny,nw,nh);
    ctx.beginPath();ctx.moveTo(nx,ny+nh/2);ctx.lineTo(nx+nw,ny+nh/2);ctx.lineWidth=.8;ctx.stroke();}}
  return new THREE.CanvasTexture(cv);
}
function mkRoofTex(hex){
  const cv=document.createElement('canvas');cv.width=64;cv.height=64;const ctx=cv.getContext('2d');
  const r=((hex>>16)&0xff)*.42,g=((hex>>8)&0xff)*.42,b=(hex&0xff)*.42;
  ctx.fillStyle=`rgb(${Math.round(r+40)},${Math.round(g+36)},${Math.round(b+30)})`;ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(cv);
}
const MC={};
function wM(hex,fl){const k=`w${hex}${fl}`;return MC[k]||(MC[k]=new THREE.MeshLambertMaterial({map:mkWallTex(hex,fl)}));}
function rM(hex){const k=`r${hex}`;return MC[k]||(MC[k]=new THREE.MeshLambertMaterial({map:mkRoofTex(hex)}));}
function sM(c){const k=`s${c}`;return MC[k]||(MC[k]=new THREE.MeshLambertMaterial({color:c}));}

function addBldg(id,b,x,z){
  const FH=4.2,h=b.fl*FH,grp=new THREE.Group();grp.position.set(x,0,z);
  const wm=wM(b.hex,b.fl),rm=rM(b.hex),gm=sM(0x9e8870);
  const body=new THREE.Mesh(new THREE.BoxGeometry(b.w,h,b.d),[wm,wm,rm,gm,wm,wm]);
  body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;grp.add(body);
  for(let f=1;f<b.fl;f++){const bar=new THREE.Mesh(new THREE.BoxGeometry(b.w+.5,.5,b.d+.5),sM(0xb0a090));bar.position.y=f*FH;grp.add(bar);}
  const rim=new THREE.Mesh(new THREE.BoxGeometry(b.w+1.4,.8,b.d+1.4),sM(0xbcad98));rim.position.y=h+.4;grp.add(rim);
  const ac=Math.min(6,Math.round((b.w*b.d)/500));
  for(let i=0;i<ac;i++){const u=new THREE.Mesh(new THREE.BoxGeometry(3.5,1.3,2.5),sM(0xdddddd));u.position.set((i%3-1)*(b.w/4),h+1.05,(i<3?-1:1)*(b.d/4));grp.add(u);}
  const glow=new THREE.Mesh(new THREE.BoxGeometry(b.w+3,h+2,b.d+3),new THREE.MeshBasicMaterial({color:0xd4af37,transparent:true,opacity:0,side:THREE.BackSide}));
  glow.position.y=h/2;glow.userData.isGlow=true;grp.add(glow);
  grp.userData={id,h};S3.add(grp);meshes[id]=grp;
}

function addMosque(b,x,z){
  const grp=new THREE.Group();grp.position.set(x,0,z);const h=8;
  const wm=wM(0xa8c4b0,1),rm=rM(b.hex),gm=sM(0x9e8870);
  const body=new THREE.Mesh(new THREE.BoxGeometry(b.w,h,b.d),[wm,wm,rm,gm,wm,wm]);
  body.position.y=h/2;body.castShadow=true;grp.add(body);
  const rim=new THREE.Mesh(new THREE.BoxGeometry(b.w+1.4,.8,b.d+1.4),sM(0xbcad98));rim.position.y=h+.4;grp.add(rim);
  const dome=new THREE.Mesh(new THREE.SphereGeometry(11,24,12,0,Math.PI*2,0,Math.PI/2),sM(0x2e7d52));
  dome.position.y=h;dome.castShadow=true;grp.add(dome);
  const pin=new THREE.Mesh(new THREE.CylinderGeometry(.25,1,2.5,8),sM(0xd4af37));pin.position.y=h+11;grp.add(pin);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.2,24,12),sM(0xd0c4ac));shaft.position.set(b.w*.38,12,b.d*.38);shaft.castShadow=true;grp.add(shaft);
  const balc=new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.2,.7,12),sM(0xbcb09a));balc.position.set(b.w*.38,24,b.d*.38);grp.add(balc);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(2.2,5,12),sM(0x2e7d52));cap.position.set(b.w*.38,27,b.d*.38);grp.add(cap);
  const glow=new THREE.Mesh(new THREE.BoxGeometry(b.w+3,h+2,b.d+3),new THREE.MeshBasicMaterial({color:0xd4af37,transparent:true,opacity:0,side:THREE.BackSide}));
  glow.position.y=h/2;glow.userData.isGlow=true;grp.add(glow);
  grp.userData={id:'5',h:28};S3.add(grp);meshes['5']=grp;
}

function addWorkshop(b,x,z){
  const grp=new THREE.Group();grp.position.set(x,0,z);const h=9;
  const wm=wM(b.hex,1),rm=rM(b.hex),gm=sM(0x9e8870);
  const body=new THREE.Mesh(new THREE.BoxGeometry(b.w,h,b.d),[wm,wm,rm,gm,wm,wm]);
  body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;grp.add(body);
  const rim=new THREE.Mesh(new THREE.BoxGeometry(b.w+1.4,.8,b.d+1.4),sM(0xbcad98));rim.position.y=h+.4;grp.add(rim);
  for(let i=0;i<5;i++){const sl=new THREE.Mesh(new THREE.BoxGeometry(b.w*.78,.5,5),sM(0x9ab8c8));sl.position.set(0,h+.7,(-b.d/2)+(b.d/6)*(i+1));grp.add(sl);}
  for(let i=0;i<3;i++){const vc=new THREE.Mesh(new THREE.CylinderGeometry(1,1.4,3.5,8),sM(0x777777));vc.position.set(-b.w/2+10+i*18,h+2,b.d/2-8);grp.add(vc);}
  const glow=new THREE.Mesh(new THREE.BoxGeometry(b.w+3,h+2,b.d+3),new THREE.MeshBasicMaterial({color:0xd4af37,transparent:true,opacity:0,side:THREE.BackSide}));
  glow.position.y=h/2;glow.userData.isGlow=true;grp.add(glow);
  grp.userData={id:'6',h};S3.add(grp);meshes['6']=grp;
}

function addRing(rad,w,color){const m=new THREE.Mesh(new THREE.RingGeometry(rad-w/2,rad+w/2,72),new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.y=.07;S3.add(m);}

function addCentral(){
  const base=new THREE.Mesh(new THREE.CylinderGeometry(23,26,7,40),sM(0xd8cdb0));base.position.y=3.5;base.castShadow=true;S3.add(base);
  const mid=new THREE.Mesh(new THREE.CylinderGeometry(16,20,6.5,40),sM(0xcdc2a6));mid.position.y=10.25;mid.castShadow=true;S3.add(mid);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(18,7,40),sM(0x8a7a60));roof.position.y=16;S3.add(roof);
  const band=new THREE.Mesh(new THREE.TorusGeometry(20,.7,8,40),sM(0xd4af37));band.rotation.x=Math.PI/2;band.position.y=7;S3.add(band);
}

function init3D(){
  const canvas=document.getElementById('c3d');
  R3=new THREE.WebGLRenderer({canvas,alpha:false,antialias:true});
  R3.setPixelRatio(Math.min(window.devicePixelRatio,2));
  R3.shadowMap.enabled=true;R3.shadowMap.type=THREE.PCFSoftShadowMap;
  S3=new THREE.Scene();S3.background=new THREE.Color(0x92bbcf);S3.fog=new THREE.FogExp2(0x92bbcf,.0014);
  C3=new THREE.PerspectiveCamera(52,1,.5,1400);setCam();
  S3.add(new THREE.AmbientLight(0xfff2e0,.72));
  const sun=new THREE.DirectionalLight(0xfff6e8,1.1);sun.position.set(200,380,140);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.near=1;sun.shadow.camera.far=1000;
  sun.shadow.camera.left=-300;sun.shadow.camera.right=300;sun.shadow.camera.top=300;sun.shadow.camera.bottom=-300;
  S3.add(sun);const fill=new THREE.DirectionalLight(0xb0ccee,.22);fill.position.set(-150,100,-100);S3.add(fill);
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(820,820),new THREE.MeshLambertMaterial({color:0xc2a468}));
  gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;S3.add(gnd);
  const court=new THREE.Mesh(new THREE.CircleGeometry(68,64),new THREE.MeshLambertMaterial({color:0xd6c68e}));
  court.rotation.x=-Math.PI/2;court.position.y=.05;S3.add(court);
  addRing(70,5.5,0xba9e78);addRing(106,6.5,0xb09470);addRing(140,4.5,0xa88c68);
  [[.88,78],[1.18,90],[1.48,84],[1.78,93],[2.06,110],[2.42,112],[2.78,120],[-.38,104]].forEach(([a,len])=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(7.5,len),new THREE.MeshLambertMaterial({color:0xaa9268}));
    m.rotation.x=-Math.PI/2;m.rotation.z=a;m.position.set(Math.sin(a)*(70+len/2),.06,Math.cos(a)*(70+len/2));S3.add(m);});
  addCentral();
  Object.entries(BLDGS).forEach(([id,b])=>{const p=toXZ(b.gps);
    if(id==='5')addMosque(b,p.x,p.z);else if(id==='6')addWorkshop(b,p.x,p.z);else addBldg(id,b,p.x,p.z);});
  resize3D();window.addEventListener('resize',resize3D);bindTouch(canvas);renderLoop();
}

let uDot3=null;
function upd3DUser(){if(!lastGPS||!S3)return;const p=toXZ(lastGPS);
  if(!uDot3){uDot3=new THREE.Mesh(new THREE.SphereGeometry(3.5,16,8),new THREE.MeshLambertMaterial({color:0x2196F3,emissive:0x0d47a1,emissiveIntensity:.4}));S3.add(uDot3);}
  uDot3.position.set(p.x,3.5,p.z);}

function renderLoop(){requestAnimationFrame(renderLoop);glowT+=.05;
  if(selId&&meshes[selId]){const g=meshes[selId].children.find(c=>c.userData.isGlow);if(g)g.material.opacity=.3+.25*Math.sin(glowT);}
  R3.render(S3,C3);}
function resize3D(){if(!R3)return;const w=window.innerWidth,h=window.innerHeight;R3.setSize(w,h);C3.aspect=w/h;C3.updateProjectionMatrix();}
function setCam(){const x=cR*Math.sin(cPh)*Math.sin(cTh),y=cR*Math.cos(cPh),z=cR*Math.sin(cPh)*Math.cos(cTh);C3.position.set(cTgt.x+x,cTgt.y+y,cTgt.z+z);C3.lookAt(cTgt);}

function bindTouch(cv){
  cv.addEventListener('touchstart',e=>{e.preventDefault();
    if(e.touches.length===1){tdrag=true;tpinch=false;td0={x:e.touches[0].clientX,y:e.touches[0].clientY};}
    else if(e.touches.length===2){tpinch=true;tdrag=false;tdist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);}
  },{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();
    if(tdrag&&e.touches.length===1){const dx=e.touches[0].clientX-td0.x,dy=e.touches[0].clientY-td0.y;
      cTh-=dx*.007;cPh=Math.max(.15,Math.min(1.42,cPh+dy*.006));td0={x:e.touches[0].clientX,y:e.touches[0].clientY};setCam();}
    else if(tpinch&&e.touches.length===2){const d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      cR=Math.max(60,Math.min(580,cR-(d-tdist)*1.4));tdist=d;setCam();}
  },{passive:false});
  cv.addEventListener('touchend',()=>{tdrag=false;tpinch=false;});
  cv.addEventListener('click',e=>pick3D(e,cv));
}

const RAY=new THREE.Raycaster(),PTR=new THREE.Vector2();
function pick3D(e,cv){
  const rc=cv.getBoundingClientRect();
  PTR.x=((e.clientX-rc.left)/rc.width)*2-1;PTR.y=-((e.clientY-rc.top)/rc.height)*2+1;
  RAY.setFromCamera(PTR,C3);
  const cands=[];Object.values(meshes).forEach(g=>g.children.forEach(c=>{if(!c.userData.isGlow)cands.push(c);}));
  const hits=RAY.intersectObjects(cands,false);
  if(hits.length){const g=hits[0].object.parent;if(g?.userData?.id)selBldg(g.userData.id);}
}
function selBldg(id){
  if(selId&&meshes[selId]){const g=meshes[selId].children.find(c=>c.userData.isGlow);if(g)g.material.opacity=0;}
  selId=id;glowT=0;
  const p=toXZ(BLDGS[id].gps);cTgt.set(p.x*.22,0,p.z*.22);cR=Math.max(160,Math.min(cR,340));setCam();
  executeSearch(id,'key',null);
}

function toggle3D(){
  is3D=!is3D;
  document.getElementById('satView').style.display=is3D?'none':'block';
  document.getElementById('view3d').style.display=is3D?'block':'none';
  document.getElementById('btn3d').classList.toggle('on',is3D);
  document.getElementById('btnGPS').style.display=is3D?'none':'flex';
  if(is3D)resize3D();
}

document.getElementById('roomInput').addEventListener('input',function(e){
  const v=e.target.value.trim(),u=v.toUpperCase();
  for(const k in KW){if(v.includes(k)){executeSearch(KW[k],'key',k);return;}}
  if(u.length===10){const bId=u[4],fl=u[5],c7=u[6],c8=u[7],isWS=isNaN(u[9]);
    if(isWS){if(fl!==c7){showToast('تنبيه: رقم الدور غير متطابق');return;}}
    else{if(fl!==c8){showToast('تنبيه: رقم الدور غير متطابق');return;}}
    executeSearch(bId,isWS?'workshop':'code',{f:fl,r:u.substring(isWS?6:7)});}
});

function executeSearch(bId,type,data){
  const b=BLDGS[bId];if(!b)return;
  isNav=false;arrived=false;dest={bId,b};
  document.getElementById('statusBar').style.display='none';
  const ne=document.getElementById('icnum');
  ne.textContent=bId;ne.style.background=b.clr+'22';ne.style.color=b.clr;ne.style.border='2px solid '+b.clr+'44';
  document.getElementById('icname').textContent=b.name;
  document.getElementById('iccat').textContent=b.dept;
  const fN={"0":"الأرضي","1":"الأول","2":"الثاني","3":"الثالث"};
  let det='';
  if(type==='key'||!data){det=`<b>القسم:</b> ${b.dept}<br><b>عدد الأدوار:</b> ${b.fl} ${b.fl===1?'دور':'أدوار'}`;}
  else{let desc=(bId==='7'&&data.f==='3')?'مكاتب إدارية':'قاعات دراسية / معامل';
    if(bId==='6'||type==='workshop')desc='ورش الميكانيكا';
    det=`<b>الدور:</b> ${fN[data.f]||data.f}<br><b>النوع:</b> ${desc}<br><b>رقم القاعة:</b> ${data.r}`;}
  document.getElementById('icdet').innerHTML=det;
  if(lastGPS&&map&&!is3D){
    const d=map.distance(lastGPS,b.gps),eta=Math.max(1,Math.round(d/WS));
    document.getElementById('mdist').textContent=Math.round(d);document.getElementById('meta').textContent=eta+' د';
    if(dMark)map.removeLayer(dMark);
    dMark=L.marker(b.gps,{icon:L.divIcon({className:'',
      html:`<div style="width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid ${b.clr};box-shadow:0 0 12px ${b.clr}99"></div>`,
      iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map).bindPopup(b.name).openPopup();
    map.flyTo(b.gps,19);drawRoute(lastGPS,b.gps,d);
  }else{document.getElementById('mdist').textContent='—';document.getElementById('meta').textContent='—';}
  document.getElementById('icard').style.display='block';
}

function startJourney(){
  if(!dest)return;if(is3D)toggle3D();
  isNav=true;arrived=false;
  document.getElementById('icard').style.display='none';
  document.getElementById('statusBar').style.display='block';
  document.getElementById('sBldg').textContent=dest.b.name;
  if(lastGPS&&map){const b=dest.b;if(dMark)map.removeLayer(dMark);
    dMark=L.marker(b.gps,{icon:L.divIcon({className:'',
      html:`<div style="width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid ${b.clr};box-shadow:0 0 12px ${b.clr}99"></div>`,
      iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map).bindPopup(b.name).openPopup();
    drawRoute(lastGPS,b.gps,map.distance(lastGPS,b.gps));}
  centerOnUser();
}
function cancelJourney(){
  isNav=false;document.getElementById('statusBar').style.display='none';
  if(routeLine){map.removeLayer(routeLine);routeLine=null;}if(dMark){map.removeLayer(dMark);dMark=null;}
  dest=null;arrived=false;document.getElementById('roomInput').value='';
}
function showArrival(){
  if(navigator.vibrate)navigator.vibrate([200,100,200,100,500]);
  document.getElementById('arsub').textContent=dest?.b.dept||'';
  document.getElementById('arrival').classList.add('show');
  document.getElementById('sDist').textContent='وصلت إلى وجهتك';document.getElementById('sEta').textContent='';
}
function dismissArrival(){document.getElementById('arrival').classList.remove('show');}
let _tt;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2600);}
</script>
</body>
